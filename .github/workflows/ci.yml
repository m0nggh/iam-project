# CI/CD pipeline
#
#   Every push / pull request to main:
#     ci      – install → lint → typecheck → unit tests → compile
#     docker  – build the image → smoke-test the running container
#   Push to main only (i.e. after a PR is merged):
#     docker  – publish the tested image to GitHub Container Registry (ghcr.io)
#
# No secrets to configure: the smoke test runs in mock mode, and GHCR uses the built-in GITHUB_TOKEN.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab – handy for demos

# Least privilege by default; the docker job asks for package write access itself.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm # reuse the npm download cache between runs

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Compile TypeScript
        run: npm run build

  docker:
    name: Build, smoke-test and publish image
    needs: ci # only package code that passed every check above
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true # keep the image locally so the next step can run it
          tags: iam-group-sync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max # layer cache between runs = faster builds

      - name: Smoke test the container (mock mode + throwaway MongoDB)
        run: |
          docker network create ci
          docker run -d --name mongo --network ci mongo:8
          # The app fails fast if MongoDB is not reachable, so wait for it first.
          until docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; do sleep 2; done

          docker run -d --name app --network ci -p 3000:3000 \
            -e GRAPH_MODE=mock -e MONGODB_URI=mongodb://mongo:27017/iam iam-group-sync:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/health && break; sleep 2; done

          echo; echo "--- /health";        curl -fsS localhost:3000/health
          echo; echo "--- POST /api/sync"; curl -fsS -X POST localhost:3000/api/sync | tee sync.json
          echo; grep -q '"fetched":' sync.json

      - name: Show container logs if the smoke test failed
        if: failure()
        run: docker logs app || true

      # ---- Publish: only for pushes to main, never for pull requests ----
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # same layers as the tested build, so this is near-instant
